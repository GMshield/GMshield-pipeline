# GMshield pipeline contract (see GMshield-pipeline/templates/pipeline.toml for every option).
# Active: the Dockerfile has the stages `test`, `test-reports`, `stand-in-backend` and `production`.

[service]
name = "frontend"
port = 3000                    # HTTP port inside the container (0 = no HTTP, no DAST)
health_path = "/api/health"    # 200 only when the backend answers with a recent enough contract

[build]
test_target = "test"         # Dockerfile stage that runs the unit tests

[dast]
path = "/"
openapi = ""                 # the frontend publishes no OpenAPI document

[deploy]
host_port = 0                  # no host port: only the tunnel on gmshield-edge will reach it (launch)
# Story 1.6 (AD-14): gmshield-edge first (the health probe joins it), gmshield-app to reach the backend
# over HTTP at http://gmshield-backend:8080 (GMSHIELD_BACKEND_URL in ~/gmshield-ci/secrets/frontend.env).
# Both are internal: the frontend has no internet. Story 1.10: every backend call carries the service
# credential GMSHIELD_FRONTEND_CREDENTIAL, also in frontend.env (deploy/data-credentials.sh writes the same
# value into backend.env). No certificate yet: HTTPS comes with the public domain.
networks = ["gmshield-edge", "gmshield-app"]
read_only = true
user = "10001:10001"
cap_drop = ["ALL"]
tmpfs = ["/tmp"]
# Story 1.22 (measured on roberto-server 2026-11-18; docs/INFRASTRUCTURE.md, "Measured ingestion"):
# memory = the frontend's docker stats peak, 122 MiB (quality reports of the SRD and the scan), x 1.3,
# rounded up to 256m. cpus = 1: the measured peak was 0.6 CPU.
memory = "256m"
cpus = 1

# The develop pipeline's throwaway copy (active DAST) runs with GMSHIELD_MODE=test and talks to the
# Dockerfile's stand-in backend at http://stand-in-backend:8080 (src/server/settings.ts).
[[staging.companions]]
target = "stand-in-backend"
alias = "stand-in-backend"
