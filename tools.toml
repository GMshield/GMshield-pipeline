# Pinned scanner images. Each is locked to a version released at least two weeks
# before adoption AND to its content digest, so a re-tagged image can never slip in.
# Trivy note: v0.69.4 was a malicious release (CVE-2026-33634, March 2026); never use it.

[images]
gitleaks = "ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
semgrep  = "semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af"
trivy    = "ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c"
zap      = "ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af"
sonar_scanner = "sonarsource/sonar-scanner-cli:12.3.0.4285_8.1.0@sha256:47956b669bf486bdad919e1cbd0533223515aa0b6d1d31763e5a3754942df6d7"
# The JDK SonarQube resolves Java types against (sonar.java.jdkHome): the backend's own build image,
# extracted once into cache/jdk/<digest>. Keep it equal to GMshield-backend's Dockerfile.
jdk27    = "eclipse-temurin:27.0.1.0-jdk-alpine@sha256:a63e42ef2a577cdb0802b73bb6f8fa2c3b0ebf1b4f00f29eb22e7f4d83b234f7"
# Throwaway services for staging and integration tests ([staging].services, [test].services), the
# same pins as GMshield-backend's dev/compose.yaml (newest release at least two weeks old on 2026-11-12).
postgres = "postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b"
redis    = "redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3"
# The SonarQube server itself (26.10 Community Build + PostgreSQL 17) is pinned in sonarqube/compose.yaml.

[semgrep]
rulesets = ["p/default", "p/owasp-top-ten", "p/cwe-top-25"]

# Hard time limits in seconds. A stage that exceeds its limit is stopped and counts as an error.
[limits]
build = 1800
unit_tests = 1800
integration_tests = 1800       # the [test].target container, beside its throwaway services
gitleaks = 600
semgrep = 1200
trivy = 1200
zap_active = 1800
zap_passive = 900
sonar = 1800                   # SonarQube scanner run
sonar_startup = 600            # SonarQube server start (about 90 s on roberto-server)
sonar_processing = 600         # SonarQube background processing of a report
startup = 180                  # time for a container to become healthy
zap_active_minutes = 10        # active-scan budget inside ZAP
zap_spider_minutes = 2
max_intermediate_commits = 20  # earlier commits in one push get a light scan each
keep_images_per_service = 3
