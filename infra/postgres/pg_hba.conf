# GMshield (Story 1.6). Nothing else is accepted: no plain TCP, no other role or database over TCP.
# TYPE   DATABASE  USER              ADDRESS  METHOD
# The superuser rpg logs in only on the container's own socket, as the postgres OS user
# (`docker exec -u postgres postgres psql -U rpg`), mapped in pg_ident.conf.
local    all       rpg                        peer map=superuser
# The backend's own role, over TLS, with SCRAM only.
hostssl  gmshield  gmshield_backend  all      scram-sha-256
